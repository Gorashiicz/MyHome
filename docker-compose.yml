services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stavba
      POSTGRES_PASSWORD: stavba
      POSTGRES_DB: stavba_pod_kontrolou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
